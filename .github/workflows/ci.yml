name: Verify Central Web
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run all unit and domain tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API dependencies
        run: npm install --prefix apps/api --no-audit --no-fund
      - name: API typecheck
        run: npm run typecheck:api
      - name: API unit and health tests
        run: npm run test:api
      - name: API build
        run: npm run build:api
      - name: Validate PostgreSQL Compose config
        run: docker compose --env-file apps/api/.env.example -f apps/api/compose.yaml config --quiet
